<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>万里典守录 · 档案里的故宫南迁 1933—1949</title>
<meta name="description" content="第一人称历史亲历 · 多分支互动文游。以一名年轻典守员的视角，走过故宫文物南迁的万里长路，五重结局，由你选择。">
<meta name="theme-color" content="#0f0d0c">
<meta property="og:title" content="万里典守录 · 故宫文物南迁 1933—1949">
<meta property="og:description" content="五幕、五重结局的互动叙事。左侧文物陈列，右侧南迁路线，你来典守。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23110e0d'/%3E%3Crect x='9' y='9' width='46' height='46' fill='none' stroke='%23a8402f' stroke-width='3'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%23c8a15a' font-family='serif'%3E守%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- 纸纹与暗角 -->
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<!-- 顶栏 -->
<header class="topbar">
  <div class="brand" id="brand" role="button" tabindex="0">
    <span class="brand-seal">守</span>
    <span class="brand-text">
      <b>万里典守录</b>
      <i>故宫文物南迁 · 1933—1949</i>
    </span>
  </div>

  <nav class="act-nav" id="actNav" aria-label="幕次进度"></nav>

  <div class="topbar-actions">
    <button class="tbtn" data-act="history" title="回忆已读的句子">回想</button>
    <button class="tbtn" data-act="save" title="存档 / 读档">卷宗</button>
    <button class="tbtn" data-act="endings" title="结局图鉴">结局</button>
    <button class="tbtn" data-act="about" title="史料与说明">史料</button>
  </div>
</header>

<!-- 三栏主体 -->
<div class="app" id="app">

  <!-- 左：文物陈列 -->
  <aside class="panel panel-relics" id="relicPanel">
    <div class="panel-head">
      <h2><span class="ph-cn">陈列</span><span class="ph-en">RELIQUARY</span></h2>
      <span class="ph-count" id="relicCount">0 / 0</span>
    </div>
    <div class="relic-grid" id="relicGrid"></div>
    <div class="panel-foot">
      <button class="ghost-btn" id="relicAll">点击文物 · 全屏鉴赏</button>
    </div>
  </aside>

  <!-- 中：正文 -->
  <main class="stage" id="stage">
    <div class="stage-inner">

      <div class="scene-meta">
        <span class="sm-act" id="smAct">第一幕</span>
        <span class="sm-sep">·</span>
        <span class="sm-time" id="smTime"></span>
        <span class="sm-sep">·</span>
        <span class="sm-place" id="smPlace"></span>
      </div>

      <article class="dossier" id="dossier">
        <div class="file-no" id="fileNo">檔案 · 第 001 號</div>
        <div class="dossier-ruler" aria-hidden="true"><span>典守錄</span></div>

        <div class="dossier-body" id="textBody" tabindex="0" aria-live="polite">
          <!-- 逐句注入 -->
        </div>

        <div class="choices" id="choices" hidden></div>

        <div class="tap-hint" id="tapHint"><span class="th-dot"></span>点击继续</div>
      </article>

      <div class="controls">
        <div class="ctrl-left">
          <button class="cbtn" id="btnAuto" title="自动播放">自动</button>
          <button class="cbtn" id="btnSkip" title="快进到本段结尾">快进</button>
        </div>
        <div class="ctrl-right">
          <button class="cbtn" id="btnReplay" title="回到上一个抉择">回到抉择</button>
          <button class="cbtn" id="btnMenu" title="重新开始">重新开始</button>
        </div>
      </div>

      <div class="stage-progress"><i id="progressBar"></i></div>
    </div>
  </main>

  <!-- 右：地图 -->
  <aside class="panel panel-map" id="mapPanel">
    <div class="panel-head">
      <h2><span class="ph-cn">行程</span><span class="ph-en">ITINERARY</span></h2>
      <span class="ph-count" id="mapStageLabel">北平</span>
    </div>
    <div class="map-wrap" id="mapWrap"></div>
    <div class="map-log" id="mapLog"></div>
    <div class="map-legend">
      <span><i class="lg lg-main"></i>已行之路</span>
      <span><i class="lg lg-ghost"></i>未择之路</span>
      <span><i class="lg lg-sea"></i>渡海</span>
    </div>
    <div class="panel-foot">
      <button class="ghost-btn" id="mapExpand">展开全图</button>
    </div>
  </aside>

</div>

<!-- 手机端切换条 -->
<nav class="mobile-tabs" id="mobileTabs">
  <button data-tab="relics">文物</button>
  <button data-tab="stage" class="is-on">剧情</button>
  <button data-tab="map">行程</button>
</nav>

<!-- 帷幕 / 开始页 -->
<div class="curtain" id="curtain">
  <div class="curtain-bg" aria-hidden="true"></div>
  <div class="curtain-inner">
    <div class="ct-kicker">第一人称历史亲历 · 大人物视角切换</div>
    <h1 class="ct-title"><span>万</span><span>里</span><span>典</span><span>守</span><span>录</span></h1>
    <div class="ct-rule"><i></i><em>壹玖叁叁 — 壹玖肆玖</em><i></i></div>
    <p class="ct-sub">档案里的故宫文物南迁</p>
    <p class="ct-desc">二千一百一十八只木箱，一万三千余件国宝。<br>三万里山河，十六年烽火。<br>你只是其中一名年轻的典守员。</p>
    <div class="ct-actions">
      <button class="btn-primary" id="btnStart">开始典守</button>
      <button class="btn-ghost" id="btnContinue" hidden>续上旧档</button>
    </div>
    <div class="ct-foot">
      <span>五幕 · 五重结局</span><span>建议佩戴耳机之外的安静</span>
    </div>
  </div>
  <div class="ct-corner tl"></div><div class="ct-corner tr"></div>
  <div class="ct-corner bl"></div><div class="ct-corner br"></div>
</div>

<!-- 通用浮层：文物 / 地图 -->
<div class="overlay" id="overlay" hidden>
  <div class="overlay-bar">
    <div class="ob-title" id="ovTitle"></div>
    <div class="ob-actions">
      <button class="ob-btn" id="ovPrev" aria-label="上一件">‹</button>
      <button class="ob-btn" id="ovNext" aria-label="下一件">›</button>
      <button class="ob-btn ob-close" id="ovClose" aria-label="关闭">关闭 ✕</button>
    </div>
  </div>
  <div class="overlay-body" id="overlayBody"></div>
</div>

<!-- 弹窗：存档 / 图鉴 / 史料 -->
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="modal-x" id="modalClose" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/map.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
